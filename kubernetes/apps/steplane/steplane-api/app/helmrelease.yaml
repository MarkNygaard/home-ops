---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: steplane-api
spec:
  chartRef:
    kind: OCIRepository
    name: steplane-api
  interval: 1h
  values:
    controllers:
      steplane-api:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/marknygaard/steplane-api
              # An immutable sha- tag, matching every other app here. This
              # replaced a mutable `main` with pullPolicy: Always, which
              # worked but meant the running code could not be identified
              # from this repo -- two pods started a day apart could differ
              # with no commit between them, and a rollback had nothing to
              # roll back to.
              #
              # pullPolicy is deliberately absent now: the default (IfNotPresent
              # for a non-:latest tag) is correct and cheaper, because a tag
              # that never moves need not be re-pulled on every restart.
              # Deploying is now a commit here, which is also what makes the
              # change reviewable and revertible.
              tag: sha-3beb45f
            envFrom:
              - secretRef:
                  name: steplane-api
            env:
              TZ: Europe/Copenhagen
              PORT: &port 3000
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      # The image is a private package on the personal GHCR account. Without
      # this the pod gets ImagePullBackOff with a 401 that reads like the
      # image does not exist.
      imagePullSecrets:
        - name: ghcr-login-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      tmp:
        type: emptyDir
    service:
      app:
        ports:
          http:
            port: *port
    # No route, by design. zero-cache is the only caller, and it reaches this
    # over cluster DNS. Publishing it would put the query and mutate endpoints
    # on the internet, where the X-Api-Key check would be the only thing
    # standing in front of the write path.
