---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: steplane-api
spec:
  chartRef:
    kind: OCIRepository
    name: steplane-api
  interval: 1h
  values:
    controllers:
      steplane-api:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/marknygaard/steplane-api
              # An immutable sha- tag, matching every other app here. This
              # replaced a mutable `main` with pullPolicy: Always, which
              # worked but meant the running code could not be identified
              # from this repo -- two pods started a day apart could differ
              # with no commit between them, and a rollback had nothing to
              # roll back to.
              #
              # pullPolicy is deliberately absent now: the default (IfNotPresent
              # for a non-:latest tag) is correct and cheaper, because a tag
              # that never moves need not be re-pulled on every restart.
              # Deploying is now a commit here, which is also what makes the
              # change reviewable and revertible.
              tag: sha-7a049d4
            envFrom:
              - secretRef:
                  name: steplane-api
            env:
              TZ: Europe/Copenhagen
              PORT: &port 3000
              # Better Auth. The secret half (BETTER_AUTH_SECRET and
              # AUTH_DATABASE_URL) is in the Secret; these two are not secret
              # and live here so a reviewer can see where auth thinks it lives
              # without decrypting anything.
              #
              # The cookie domain is the apex, not api.${STEPLANE_DOMAIN}: the
              # web app is served from the apex and the API from a subdomain,
              # so a cookie scoped to the subdomain would not be sent by the
              # app, and one scoped to the apex is sent to both.
              BETTER_AUTH_URL: https://${STEPLANE_DOMAIN}
              AUTH_COOKIE_DOMAIN: ${STEPLANE_DOMAIN}
              # SES, for the emailed sign-in code. Region and From are not
              # secret and live here; the access key pair is in the Secret.
              #
              # The From address must be a verified SES identity, and the
              # account must be out of the SES sandbox to mail anyone who has
              # not been verified individually -- otherwise sign-in silently
              # works for you and for nobody else.
              # Declares the environment explicitly. The API refuses to
              # start if this is production and DEV_AUTH_SECRET is also set,
              # which is why that key was removed from the Secret in the same
              # commit -- the two changes are not independently deployable.
              STEPLANE_ENV: production
              AWS_REGION: eu-north-1
              SES_FROM: "Steplane <login@${STEPLANE_DOMAIN}>"
              # Quoted deliberately. YAML 1.1 resolves a bare `on` to the
              # boolean true, which would reach the container as the string
              # "true" rather than "on" -- the quotes are what keep the value
              # the API is actually looking for.
              #
              # Production only. The dev API is left as it was, so that if
              # this turns out to gate something unexpectedly, dev-api still
              # answers and can be compared against.
              SSO_ENABLED: "on"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      # The image is a private package on the personal GHCR account. Without
      # this the pod gets ImagePullBackOff with a 401 that reads like the
      # image does not exist.
      imagePullSecrets:
        - name: ghcr-login-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      tmp:
        type: emptyDir
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/name: steplane-api
        # Published because the browser now needs it: Vercel rewrites
        # ${STEPLANE_DOMAIN}/api/* here, and Better Auth's sign-in flow runs
        # in this service. Until this commit the API had no route at all and
        # zero-cache reached it over cluster DNS only.
        #
        # What that changes, stated plainly: the Zero query and mutate
        # endpoints are now reachable from the internet, guarded by the
        # X-Api-Key check alone.
        #
        # DEV_AUTH_SECRET is gone from production as of this commit. It
        # authenticated as any user from one static string, and while PR #40
        # had narrowed it to demo accounts at the RFC 2606 example.com domain
        # (enforced in the database by app.is_demo_user, SECURITY DEFINER),
        # it remained a static secret on a public endpoint.
        #
        # The development login now lives only in steplane-api-dev at
        # dev-api.${STEPLANE_DOMAIN}, with its own distinct value. Production
        # authenticates through Better Auth sessions alone.
        hostnames:
          - "api.${STEPLANE_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
