---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zero-cache
spec:
  # Namespace is required, not decoration: Flux resolves dependsOn within the
  # Kustomization's own namespace unless told otherwise, so without this it
  # would wait forever on a `cloudnativepg-cluster` in `steplane` that does
  # not exist.
  dependsOn:
    - name: cloudnativepg-cluster
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/steplane/zero-cache/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: steplane
  wait: false
