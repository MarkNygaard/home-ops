---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zero-cache
spec:
  chartRef:
    kind: OCIRepository
    name: zero-cache
  interval: 1h
  values:
    controllers:
      zero-cache:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        # Recreate, not RollingUpdate. Two pods must never hold the SQLite
        # replica at once, and a rolling update exists precisely to run the old
        # and new pods together. This trades a few seconds of downtime per
        # deploy for never corrupting the replica. No HPA for the same reason.
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/rocicorp/zero
              tag: 1.11.3
            env:
              TZ: Europe/Copenhagen
              ZERO_REPLICA_FILE: /data/replica.db
              ZERO_ENABLE_CRUD_MUTATIONS: "false"
              # Names the publication explicitly, because zero-cache cannot
              # create its own here. Left to itself it runs
              #   CREATE PUBLICATION _zero_public_0 FOR TABLES IN SCHEMA public
              # and Postgres requires superuser for the FOR TABLES IN SCHEMA
              # form specifically -- ownership is enough for FOR TABLE, but not
              # this. The cluster runs enableSuperuserAccess: false, so the
              # first deploy crashlooped on
              #   must be superuser to create FOR TABLES IN SCHEMA publication
              #
              # steplane_zero is maintained by Steplane's own migrations and
              # lists its tables explicitly. That is deliberately NOT a
              # schema-wide publication, and the difference is the point.
              #
              # This replaced a hand-made zero_data created as
              #   CREATE PUBLICATION zero_data FOR TABLES IN SCHEMA public;
              # which was convenient and wrong: a schema-wide publication
              # auto-includes every table added later, so it had swept in the
              # Better Auth tables -- account, session, verification,
              # invitation. Those are credentials and tokens, and everything
              # published lands in this pod's SQLite replica, which is what
              # browsers read from. steplane_zero carries the 16 app tables
              # (including user/member/organization, needed to render who is
              # who) and leaves the four secret-bearing ones on the server.
              #
              # The lesson generalises: with Zero, the publication IS a
              # security boundary, because logical replication ignores RLS.
              # Adding a table to the published set publishes its rows to
              # clients. Prefer an explicit table list over a schema.
              #
              # The name must not begin with an underscore; Zero reserves that
              # prefix for publications it manages itself. Changing this value
              # forces a full replica resync -- expected and cheap here.
              ZERO_APP_PUBLICATIONS: steplane_zero
              # The Hono API. Cluster-internal http:// to a Service in this
              # namespace -- there is no reason to leave the cluster and come
              # back in through Cloudflare to reach a pod next door, and the
              # API has no HTTPRoute precisely so it cannot be reached any
              # other way.
              #
              # zero-cache sends ZERO_QUERY_API_KEY / ZERO_MUTATE_API_KEY from
              # the secret as an X-Api-Key header on these calls, and the API
              # rejects anything that does not match. That check is what makes
              # a cluster-internal endpoint safe to leave unauthenticated at
              # the network layer.
              #
              # These are not secret, so they live here rather than in the
              # encrypted file: a reviewer should be able to see where
              # zero-cache sends queries and mutations without decrypting
              # anything.
              # Forward the browser's cookies to the query and mutate
              # endpoints. Better Auth issues a session cookie on the apex
              # domain; without this, zero-cache strips it and the API sees
              # an anonymous caller on every request.
              ZERO_QUERY_FORWARD_COOKIES: "true"
              ZERO_MUTATE_FORWARD_COOKIES: "true"
              ZERO_QUERY_URL: http://steplane-api.steplane.svc.cluster.local:3000/api/zero/query
              ZERO_MUTATE_URL: http://steplane-api.steplane.svc.cluster.local:3000/api/zero/mutate
              # Left to itself Zero starts max(1, cores - 1) sync worker
              # processes, which on these 14-core MS-01 nodes is 13-14. Each
              # budgets up to ~262 MB of deferred IVM writes, and the pod sat
              # at 983Mi resident with no clients and no data -- half the 2Gi
              # limit before anything had happened.
              #
              # Four is ample for a prototype and leaves real headroom. Raise
              # it when concurrent client syncing actually becomes the
              # bottleneck, together with the memory limit below; the two have
              # to move as a pair.
              ZERO_NUM_SYNC_WORKERS: "4"
            # ZERO_UPSTREAM_DB and ZERO_ADMIN_PASSWORD arrive from here.
            # ZERO_QUERY_URL and ZERO_MUTATE_URL will join them once the Hono
            # API is deployed; they are not secret, but keeping them in the
            # same Secret means one encrypted file to edit rather than values
            # split across two places.
            #
            # Upstream is the in-cluster CNPG cluster. Two consequences worth
            # knowing before debugging a surprise resync:
            #
            # 1. Logical replication slots do not survive a CNPG switchover on
            #    their own, and a switchover happens on every Talos upgrade --
            #    that is by design here, it is what unblocks the node drain.
            #    So expect zero-cache to resync after a Talos upgrade. Cheap
            #    while this database is small; revisit via PG 18 failover
            #    slots if it stops being cheap.
            # 2. The cluster runs with enableSuperuserAccess: false, so Zero
            #    cannot install the event triggers it uses to detect schema
            #    changes gracefully. Migrations therefore force a full resync.
            #    Settle the schema before this matters. The same missing
            #    superuser is why ZERO_APP_PUBLICATIONS is set above.
            #
            # Granting the steplane role SUPERUSER would remove both problems
            # and is the wrong trade: superuser is cluster-wide, not
            # database-scoped, so it would also hand Steplane full access to
            # Authentik, n8n and every other database on this cluster.
            envFrom:
              - secretRef:
                  name: zero-cache-env
            lifecycle:
              preStop:
                exec:
                  # Let in-flight WebSocket clients notice the close before the
                  # process goes. Paired with the 600s grace period below, which
                  # is what actually allows a long shutdown.
                  command: ["/bin/sh", "-c", "sleep 10"]
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 4848
                  periodSeconds: 5
                  # 120 x 5s = 10 minutes. First start replicates the whole
                  # upstream database into SQLite, and failing the rollout
                  # part-way through that would look like a broken image.
                  failureThreshold: 120
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /keepalive
                    port: *port
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              # The image declares no USER, so it would otherwise run as root.
              # It is pinned to a non-root UID below instead. The root
              # filesystem stays writable because the image's workdir is
              # /opt/app and nothing here has established that it only ever
              # writes to /data.
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 1000m
                memory: 1Gi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # Long enough for the preStop sleep plus an orderly SQLite shutdown.
      # Killing this mid-write is how a replica gets corrupted and has to
      # resync from upstream.
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    # 4849 is deliberately absent. The image exposes it, but nothing should
    # reach it -- not through this Service, and not through the route below.
    persistence:
      data:
        existingClaim: zero-cache-data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/name: zero-cache
        # Both hostnames, deliberately. Keeping the original working means
        # the new one can be verified before anything depends on it, and a
        # mistake here does not take the existing endpoint down.
        hostnames:
          - "zero.${SECRET_DOMAIN}"
          - "zero.${STEPLANE_DOMAIN}"
        parentRefs:
          # External, because browsers connect from outside the LAN. The
          # Cloudflare Tunnel already publishes a wildcard *.${SECRET_DOMAIN}
          # to this gateway, so no cloudflared config change is needed -- the
          # hostname works as soon as external-dns creates the record from
          # this route.
          #
          # There is no Cloudflare Access in front, by design -- but note that
          # zero-cache does NOT authenticate callers itself. The
          # ZERO_AUTH_SECRET / ZERO_AUTH_JWK / ZERO_AUTH_JWKS_URL options that
          # used to do that are deprecated in 1.11. zero-cache now forwards the
          # client's token (Authorization: Bearer, or cookies with
          # ZERO_*_FORWARD_COOKIES) to ZERO_QUERY_URL and ZERO_MUTATE_URL, and
          # the API behind those decides who the caller is.
          #
          # So until that API exists, this hostname is public with nothing
          # enforcing anything. It is currently harmless only because the
          # steplane database has no tables -- the publication reports zero
          # published tables, so there is nothing to serve. Do not put real
          # data in before the API is authenticating.
          #
          # Worth stating plainly because it is easy to assume otherwise:
          # Postgres RLS cannot be the read-side boundary here. Logical
          # replication ignores RLS, so every row of every tenant lands in this
          # pod's SQLite replica and browsers read from that, never from
          # Postgres. RLS still protects the write path, which goes through the
          # API. The read path's only boundary is the query handlers.
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
