---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-barman-plugin
spec:
  chartRef:
    kind: OCIRepository
    name: cnpg-barman-plugin
  interval: 1h
  values:
    # The plugin talks to the operator over gRPC with mutual TLS, and the
    # chart issues those certificates through cert-manager.
    certManager:
      enabled: true
