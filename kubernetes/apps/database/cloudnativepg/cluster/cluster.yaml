---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  # Two instances so the postgres-primary PDB is satisfiable. With one
  # instance allowedDisruptions is permanently 0, which blocks every node
  # drain and has stalled four Talos upgrades in a row. With a replica,
  # CNPG switches over on eviction and the drain proceeds normally.
  instances: 2
  # PostgreSQL 18, straight from 16. pg_upgrade goes from any older major to
  # the current one, so skipping 17 is one upgrade rather than two.
  #
  # Both sides are bookworm, which is the thing that matters: pg_upgrade runs
  # the OLD binaries inside the NEW image, and the last attempt — from
  # pgvecto.rs 16 (bullseye) — failed its check because those binaries could
  # not find libssl.so.1.1. Moving to 16-standard-bookworm first is what made
  # this an ordinary upgrade.
  #
  # Checked before trying: the image carries pgvector 0.8.6, every database
  # uses C collation so no text index can be invalidated, nothing is in
  # shared_preload_libraries, and the operator accepted the change in a
  # server-side dry run.
  imageName: ghcr.io/cloudnative-pg/postgresql:16-standard-bookworm
  primaryUpdateStrategy: unsupervised
  # Continuous WAL archiving to R2, via the barman-cloud plugin. `isWALArchiver`
  # is what turns archiving on: without it the plugin can take base backups but
  # recovery stops at the last one, which is not point-in-time recovery.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-r2
  # Keep the two instances on separate nodes — local-path PVCs are
  # node-pinned, so co-locating them would defeat the point.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  storage:
    size: 10Gi
    storageClass: local-path
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
      effective_cache_size: 512MB
      work_mem: 4MB
      maintenance_work_mem: 64MB
      # ai-harness has 873 schemas and 2662 tables — one schema per tenant.
      # pg_dump in --binary-upgrade mode locks every one of them in a single
      # transaction, plus their indexes, which overflows the lock table at the
      # default 64 and fails the major upgrade with "out of shared memory".
      #
      # 1024 x max_connections gives ~205k lock slots against the ~15k that
      # dump needs, for roughly 35MB of shared memory. It has to be set before
      # the upgrade: pg_upgrade starts the OLD server from this config.
      max_locks_per_transaction: "1024"
    # No shared_preload_libraries. `vectors.so` (pgvecto.rs) was preloaded here
    # and installed in exactly zero databases — checked across all eight. The
    # only vector extension in use is pgvector (`vector` 0.8.0, in
    # mission-control), which is a different project and needs no preloading.
    #
    # Dropping it before the PostgreSQL 17 upgrade removes the upgrade's main
    # risk: a preloaded library that must exist in the new image or the server
    # will not start at all.
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
  monitoring:
    enablePodMonitor: true
