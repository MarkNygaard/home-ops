---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  # Two instances so the postgres-primary PDB is satisfiable. With one
  # instance allowedDisruptions is permanently 0, which blocks every node
  # drain and has stalled four Talos upgrades in a row. With a replica,
  # CNPG switches over on eviction and the drain proceeds normally.
  instances: 2
  # CloudNativePG's own image, still PostgreSQL 16. Same major version, so
  # this is a rolling restart and not a pg_upgrade — which is the point.
  #
  # The direct jump to 17-standard-bookworm failed its pg_upgrade check:
  # pg_upgrade runs the OLD binaries inside the NEW image, and pgvecto.rs 16 is
  # Debian bullseye (libssl.so.1.1) while these images are bookworm (OpenSSL 3),
  # so the old `postgres -V` could not start. This step moves the userland to
  # bookworm without an upgrade, leaving 17 as an ordinary one later.
  #
  # It is worth doing on its own: pgvecto.rs is deprecated upstream and nothing
  # here used its extension, while this image is maintained and carries
  # pgvector 0.8.6 (up from 0.8.0). Every database uses C collation, so the
  # glibc change between Debian releases cannot invalidate any index.
  imageName: ghcr.io/cloudnative-pg/postgresql:16-standard-bookworm
  primaryUpdateStrategy: unsupervised
  # Continuous WAL archiving to R2, via the barman-cloud plugin. `isWALArchiver`
  # is what turns archiving on: without it the plugin can take base backups but
  # recovery stops at the last one, which is not point-in-time recovery.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-r2
  # Keep the two instances on separate nodes — local-path PVCs are
  # node-pinned, so co-locating them would defeat the point.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  storage:
    size: 10Gi
    storageClass: local-path
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
      effective_cache_size: 512MB
      work_mem: 4MB
      maintenance_work_mem: 64MB
    # No shared_preload_libraries. `vectors.so` (pgvecto.rs) was preloaded here
    # and installed in exactly zero databases — checked across all eight. The
    # only vector extension in use is pgvector (`vector` 0.8.0, in
    # mission-control), which is a different project and needs no preloading.
    #
    # Dropping it before the PostgreSQL 17 upgrade removes the upgrade's main
    # risk: a preloaded library that must exist in the new image or the server
    # will not start at all.
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
  monitoring:
    enablePodMonitor: true
