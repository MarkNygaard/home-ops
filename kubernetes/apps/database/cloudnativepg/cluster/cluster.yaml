---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  # Two instances so the postgres-primary PDB is satisfiable. With one
  # instance allowedDisruptions is permanently 0, which blocks every node
  # drain and has stalled four Talos upgrades in a row. With a replica,
  # CNPG switches over on eviction and the drain proceeds normally.
  instances: 2
  # PostgreSQL 17 on CloudNativePG's own image, which ships pgvector (0.8.6,
  # up from the 0.8.0 mission-control has). This leaves pgvecto.rs behind: it
  # is deprecated upstream, and its `vectors` extension was installed in none
  # of the eight databases here, so there is nothing of it to carry over.
  #
  # Changing this triggers a declarative offline in-place pg_upgrade. The
  # operator copies the old binaries into the upgrade job, so crossing image
  # families is fine; it reads the major version from the tag, which is why
  # the tag has to start with `17`.
  # Back on 16 after the upgrade to 17-standard-bookworm failed its pg_upgrade
  # check: pg_upgrade runs the OLD binaries inside the NEW image, and these two
  # images do not share a userland. pgvecto.rs 16 is Debian bullseye
  # (libssl.so.1.1); CloudNativePG's bookworm image has OpenSSL 3, so the old
  # `postgres -V` could not even start.
  #
  # The route to 17 is therefore two steps, not one: first swap to
  # ghcr.io/cloudnative-pg/postgresql:16-standard-bookworm, which is the same
  # major and so a plain restart rather than an upgrade, and only then go to 17
  # with both sides on bookworm.
  imageName: ghcr.io/tensorchord/cloudnative-pgvecto.rs:16-v0.4.0
  primaryUpdateStrategy: unsupervised
  # Continuous WAL archiving to R2, via the barman-cloud plugin. `isWALArchiver`
  # is what turns archiving on: without it the plugin can take base backups but
  # recovery stops at the last one, which is not point-in-time recovery.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-r2
  # Keep the two instances on separate nodes — local-path PVCs are
  # node-pinned, so co-locating them would defeat the point.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  storage:
    size: 10Gi
    storageClass: local-path
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
      effective_cache_size: 512MB
      work_mem: 4MB
      maintenance_work_mem: 64MB
    # No shared_preload_libraries. `vectors.so` (pgvecto.rs) was preloaded here
    # and installed in exactly zero databases — checked across all eight. The
    # only vector extension in use is pgvector (`vector` 0.8.0, in
    # mission-control), which is a different project and needs no preloading.
    #
    # Dropping it before the PostgreSQL 17 upgrade removes the upgrade's main
    # risk: a preloaded library that must exist in the new image or the server
    # will not start at all.
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
  monitoring:
    enablePodMonitor: true
