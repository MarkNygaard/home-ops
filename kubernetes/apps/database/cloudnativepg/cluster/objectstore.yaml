---
# Where Postgres backups and WAL go.
#
# A prefix inside the bucket volsync already uses, so the existing R2 token
# covers it and there is nothing new to create in Cloudflare. Barman writes
# under `postgres/<serverName>/`, keeping it clear of volsync's own paths.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-r2
spec:
  configuration:
    destinationPath: s3://cluster-volsync/postgres
    endpointURL: ${R2_ENDPOINT_URL}
    s3Credentials:
      accessKeyId:
        name: postgres-backup-r2
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-backup-r2
        key: SECRET_ACCESS_KEY
    wal:
      compression: gzip
      # Two at a time: this is a 3-node home cluster on 2.5 GbE, and the point
      # is that archiving keeps up, not that it finishes first.
      maxParallel: 2
    data:
      compression: gzip
  # 7 days. A nightly base backup means this many full copies of a database
  # that changes slowly, and 30 was simply more than anyone would restore
  # from — roughly 12GB, which is past R2's 10GB free tier. Seven is about
  # 3.5GB and stays inside it.
  #
  # Not 3, which was the other candidate: the window has to outlast a mistake
  # nobody notices at once, and a week covers "away for the weekend, spotted
  # it on Monday". The difference in cost between the two is about two cents a
  # month, so the recovery window is the only thing worth optimising here.
  #
  # barman's retention is a single window rather than a tiered daily/weekly
  # scheme, so this number is the only dial.
  retentionPolicy: 7d
