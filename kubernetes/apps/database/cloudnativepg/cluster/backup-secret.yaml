---
# S3 credentials for barman, in the shape the ObjectStore expects: one key per
# value, rather than the env-var bundle restic wants.
#
# Not SOPS-encrypted because it holds no literal secret — Flux substitutes both
# values from `cluster-secrets`, which is encrypted. The same R2 token volsync
# already uses, on the same bucket.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-r2
type: Opaque
stringData:
  ACCESS_KEY_ID: ${VOLSYNC_R2_ACCESS_KEY_ID}
  SECRET_ACCESS_KEY: ${VOLSYNC_R2_SECRET_ACCESS_KEY}
