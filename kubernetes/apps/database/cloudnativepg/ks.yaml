---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnativepg
spec:
  interval: 1h
  path: ./kubernetes/apps/database/cloudnativepg/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnativepg-cluster
spec:
  dependsOn:
    - name: cloudnativepg
    # The Cluster references the barman plugin by name; without this it can be
    # applied before the plugin exists and archiving silently does not start.
    - name: cnpg-barman-plugin
  interval: 1h
  path: ./kubernetes/apps/database/cloudnativepg/cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
