---
# The registry's own entry point, kept separate from database/postgres-lb on
# .15 so the WAN port-forward targets an address used for nothing else — it can
# be moved or withdrawn without touching how anything on the LAN reaches
# Postgres.
apiVersion: v1
kind: Service
metadata:
  name: postgres-registry-lb
  annotations:
    # No public DNS record is created from here: the A record has to point at
    # the router's WAN address, which the cluster doesn't know. See the runbook
    # in ../README.md.
    external-dns.alpha.kubernetes.io/controller: none
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.42.19
  # REQUIRED, not a tuning knob. With the default `Cluster` policy Cilium SNATs
  # incoming connections to a node address in 192.168.42.0/24, which is exactly
  # the range pg_hba trusts for every role — an internet client would arrive
  # looking like it came from the SERVERS VLAN and the lockdown would be
  # worthless. `Local` preserves the real client address so pg_hba can tell the
  # difference.
  externalTrafficPolicy: Local
  selector:
    cnpg.io/cluster: postgres
    # The current label; `role: primary` used by postgres-lb is deprecated.
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
