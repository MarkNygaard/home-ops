---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harness-registry
spec:
  dependsOn:
    - name: cloudnativepg-cluster
  interval: 1h
  path: ./kubernetes/apps/database/harness-registry/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: false
