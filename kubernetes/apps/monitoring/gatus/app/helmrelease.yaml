---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  chartRef:
    kind: OCIRepository
    name: gatus
  interval: 1h
  values:
    controllers:
      gatus:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 256Mi
        initContainers:
          gatus-sidecar:
            image:
              repository: ghcr.io/home-operations/gatus-sidecar
              tag: 0.5.3
            args:
              - --auto-httproute
              - --enable-httproute
            restartPolicy: Always
        containers:
          app:
            image:
              repository: ghcr.io/twin/gatus
              tag: v5.36.0
            env:
              GATUS_DELAY_START_SECONDS: 5
              GATUS_CONFIG_PATH: /config
              GATUS_WEB_PORT: &port 8080
              TZ: Europe/Copenhagen
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    serviceAccount:
      gatus:
        enabled: true
    rbac:
      roles:
        gatus:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: ["services"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["gateway.networking.k8s.io"]
              resources: ["gateways", "httproutes"]
              verbs: ["get", "list", "watch"]
      bindings:
        gatus:
          type: ClusterRoleBinding
          roleRef:
            identifier: gatus
          subjects:
            - identifier: gatus
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
    persistence:
      data:
        existingClaim: gatus
        globalMounts:
          - path: /data
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        name: gatus
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
    configMaps:
      config:
        data:
          config.yaml: |
            storage:
              type: sqlite
              caching: true
              path: /data/gatus.db
            metrics: true
            alerting:
              ntfy:
                url: http://ntfy.monitoring.svc.cluster.local
                topic: gatus
                default-alert:
                  enabled: true
                  send-on-resolved: true
                  failure-threshold: 3
                  success-threshold: 3
            connectivity:
              checker:
                target: 1.1.1.1:53
                interval: 1m
            endpoints:
              - name: Cloudflare
                group: connectivity
                url: "icmp://1.1.1.1"
                interval: 1m
                conditions:
                  - "[CONNECTED] == true"
              - name: Google
                group: connectivity
                url: "icmp://8.8.8.8"
                interval: 1m
                conditions:
                  - "[CONNECTED] == true"
              # Resolved through public resolvers on purpose. Every other
              # check in this file, and every annotation-discovered one,
              # resolves through AdGuard and k8s-gateway -- so they all pass
              # whether or not the name exists on the internet.
              #
              # That gap cost 36 hours on 2026-09-12: external-dns 1.22.0 tried
              # to publish A records pointing at the private LoadBalancer
              # address, Cloudflare refused them, and every externally-routed
              # hostname went NXDOMAIN. Ownership TXT records survived with no
              # address record beside them. Nothing alerted, because from inside
              # the house everything still resolved and answered.
              #
              # NXDOMAIN is the specific signal -- not latency, not content.
              # These records are proxied, so the addresses behind them are
              # Cloudflare's and change without notice; asserting on the answer
              # would alarm on a routine edge change. NOERROR means external-dns
              # published something, which is the whole question.
              #
              # Three hostnames from three apps rather than one. They share a
              # single publisher, so a real failure takes all three at once --
              # with one check, a per-app cause and a cluster-wide one would
              # look identical.
              - name: niles
                group: external dns
                url: "1.1.1.1"
                dns:
                  query-name: "niles.${SECRET_DOMAIN}"
                  query-type: "A"
                interval: 5m
                conditions:
                  - "[DNS_RCODE] == NOERROR"
              - name: authentik
                group: external dns
                url: "1.1.1.1"
                dns:
                  query-name: "auth.${SECRET_DOMAIN}"
                  query-type: "A"
                interval: 5m
                conditions:
                  - "[DNS_RCODE] == NOERROR"
              # Deliberately a different resolver, so a Cloudflare DNS incident
              # is distinguishable from our records actually being gone.
              - name: ntfy
                group: external dns
                url: "8.8.8.8"
                dns:
                  query-name: "ntfy.${SECRET_DOMAIN}"
                  query-type: "A"
                interval: 5m
                conditions:
                  - "[DNS_RCODE] == NOERROR"
            ui:
              title: Status | Home Ops
              header: Status
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "status.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
