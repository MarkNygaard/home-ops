---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  chartRef:
    kind: OCIRepository
    name: loki
  interval: 1h
  values:
    global:
      image:
        registry: docker.io
    deploymentMode: Monolithic
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        # 7d, matching Prometheus. Enforced by the compactor below — without
        # `retention_enabled` this value is inert and the chunks stay forever.
        retention_period: 7d
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    gateway:
      enabled: false
    test:
      enabled: false
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    # Nested under `monitoring`, which is where this key has always lived.
    # It sat at the top level from the original Loki commit until now, where
    # the chart simply ignored it -- 18.x shipped no values schema, so a
    # misplaced key was silently dropped rather than rejected. The result was
    # that Loki exposed metrics on http-metrics:3100 that nothing scraped,
    # and no ServiceMonitor existed for it in any namespace.
    #
    # Chart 20.x added a values schema, which is what turned the long-standing
    # mistake into a CI failure:
    #   additional properties 'serviceMonitor' not allowed
    #
    # So merging this starts scraping Loki for the first time. That is the
    # intent of the line, but it is a new behaviour, not a restored one.
    #
    # Only serviceMonitor is enabled here. monitoring.dashboards, .rules,
    # .alerts and .selfMonitoring all default to false and stay off -- they
    # pull in extra resources nobody asked for.
    monitoring:
      serviceMonitor:
        enabled: true
