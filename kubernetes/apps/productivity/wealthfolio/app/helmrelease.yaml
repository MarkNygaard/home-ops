---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wealthfolio
spec:
  chartRef:
    kind: OCIRepository
    name: wealthfolio
  interval: 1h
  values:
    controllers:
      wealthfolio:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/wealthfolio/wealthfolio
              tag: 3.7.0
            env:
              TZ: Europe/Copenhagen
              WF_LISTEN_ADDR: 0.0.0.0:8088
              # SQLite file lives on the Volsync-backed PVC — nightly restic
              # snapshot to R2 keeps the ledger recoverable.
              WF_DB_PATH: /data/app.db
            envFrom:
              - secretRef:
                  name: wealthfolio-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8088
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: wealthfolio
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/name: wealthfolio
        hostnames:
          - "wealthfolio.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
