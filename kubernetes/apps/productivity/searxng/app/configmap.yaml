---
# SearXNG settings.yml. Mounted into the container at /etc/searxng/settings.yml.
#
# `use_default_settings: true` inherits all defaults from the image's built-in
# settings template (engine list, supported locales, etc.). Only the keys
# declared below override the defaults.
#
# secret_key is committed in plaintext because the file is not SOPS-encrypted
# (ConfigMaps aren't conventionally SOPS-encrypted in this repo). Rotation is
# a one-line edit + push. The value here only protects Flask session-cookie
# integrity for a LAN-only deployment — low blast radius.
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
data:
  settings.yml: |
    use_default_settings: true

    general:
      instance_name: "SearXNG @ mnygaard.io"
      privacypolicy_url: false
      donation_url: false
      contact_url: false
      enable_metrics: true

    server:
      secret_key: "acaf34017dace9159f3293523926cf45c486fe58b50ecfa72dd3a6a7152f802c"
      base_url: "https://search.${SECRET_DOMAIN}/"
      # Bot limiter disabled for LAN-only deployment. Re-enabling it requires
      # a limiter.toml that lists envoy-internal's pod-CIDR as a trusted
      # proxy AND sets real_ip.x_for=1, so the limiter looks past envoy for
      # the actual client IP. Without that, SearXNG sees only the envoy hop
      # and 429s every request with "X-Forwarded-For nor X-Real-IP header is
      # set".
      limiter: false
      image_proxy: true
      bind_address: "0.0.0.0"
      port: 8080
      method: "GET"
      default_http_headers:
        X-Content-Type-Options: nosniff
        X-Download-Options: noopen
        X-Robots-Tag: noindex, nofollow
        Referrer-Policy: no-referrer

    # SearXNG renamed the config section: redis.url → valkey.url (the
    # behavior is identical; both still talk to the existing Redis/Valkey
    # at redis.database.svc.cluster.local:6379).
    valkey:
      url: "redis://redis.database.svc.cluster.local:6379/0"

    ui:
      default_locale: "en"
      query_in_title: true
      infinite_scroll: false
      center_alignment: false
      default_theme: "simple"
      theme_args:
        simple_style: "dark"

    # Bind outgoing requests to the IPv4 wildcard, which pins the socket family
    # to AF_INET. SearXNG passes source_ips straight to httpx as local_address,
    # and httpx derives the address family from it.
    #
    # Without this, every engine whose hostname has an AAAA record fails. The
    # pod has a single IPv4 address and no IPv6 route, so httpx resolves
    # www.google.com to both families, tries v6 first, gets ENETUNREACH, and
    # reports the misleading "All connection attempts failed" -- which reads
    # like a firewall or a block rather than a missing route.
    #
    # Measured from inside the pod:
    #
    #   podIPs               [10.42.2.162]   (no IPv6)
    #   IPv6 -> google:443   Network is unreachable
    #   IPv4 -> google:443   connected
    #   google (has AAAA)    0 results
    #   bing   (A only)      10 results
    #   github (A only)      30 results
    #
    # That split is the whole diagnosis: engines without AAAA were never
    # broken. duckduckgo and startpage are a separate and genuine problem --
    # they answer with a CAPTCHA, which no amount of config fixes.
    #
    # Same root cause as the Flux source-controller SSH timeouts already
    # recorded for this cluster: AAAA lookups on an IPv4-only network.
    outgoing:
      source_ips:
        - 0.0.0.0

    # Engine selection, because the IPv4 fix alone still left plain search
    # returning nothing. Those are two separate faults with one symptom.
    #
    # A query with no engines= parameter uses the general category, whose
    # SearXNG defaults are brave, duckduckgo, startpage and google. Three of
    # those answer with an anti-bot challenge against this exit address, and
    # google returns a page the parser reads as empty -- no error, no results.
    # bing works perfectly but ships disabled, so the one healthy general
    # engine was the one not being asked.
    #
    # Measured per engine, after the IPv4 binding:
    #
    #   bing        10 results        google      0, silently
    #   wiby         8 results        brave       Suspended: too many requests
    #   github      30 results        duckduckgo  CAPTCHA
    #                                 startpage   Suspended: CAPTCHA
    #                                 qwant       access denied
    #                                 marginalia  Suspended
    #
    # Enabling bing is what makes a plain query work again. The blocked four
    # are turned off rather than left in: each costs a request and a timeout
    # per search and contributes nothing, and leaving them makes the instance
    # look broken in the UI. They are worth re-testing occasionally -- these
    # blocks are against the address, not permanent by nature.
    engines:
      - name: bing
        disabled: false
      - name: wiby
        disabled: false
      - name: duckduckgo
        disabled: true
      - name: brave
        disabled: true
      - name: startpage
        disabled: true
      - name: qwant
        disabled: true

    search:
      safe_search: 0
      autocomplete: "duckduckgo"
      default_lang: "en"
      ban_time_on_fail: 5
      max_ban_time_on_fail: 120
      formats:
        - html
        - json
