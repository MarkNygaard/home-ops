---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: niles
spec:
  chartRef:
    kind: OCIRepository
    name: niles
  interval: 1h
  values:
    controllers:
      niles:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/marknygaard/niles
              tag: sha-7538c58
            args:
              - serve
            env:
              TZ: Europe/Copenhagen
            envFrom:
              - secretRef:
                  name: niles-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                # 1Gi because the current build needs the headroom. 512Mi was
                # set when niles did less; it now holds speaker-recognition
                # state and its working set sits around 244Mi and rises with
                # use rather than staying flat.
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
      # Wyoming, for the hardware voice satellite. A second Service rather
      # than another port on `app`, so the HTTP API keeps reaching the LAN
      # only through the gateway and its TLS, instead of also appearing
      # unencrypted on this address.
      #
      # LoadBalancer because the protocol is raw TCP -- line-delimited JSON
      # headers then binary audio frames -- which an HTTPRoute cannot carry.
      # That is not only a parsing objection: the gateway's Envoy runs with
      # proxy-idle-timeout-seconds 60, so a satellite holding an open
      # connection between wake words would be cut every minute. A plain L4
      # Service bypasses the proxy entirely and inherits Cilium's conntrack
      # timeout instead, which defaults to six hours for established TCP.
      #
      # The address is pinned, not allocated: the satellite is flashed with a
      # fixed host and port, so an IP that moved on redeploy would silently
      # stop working. .19 is the next free address after jitsi-meet-jvb .18.
      wyoming:
        controller: niles
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.42.19"
        ports:
          wyoming:
            port: 10300
            protocol: TCP
    persistence:
      # No config-file mount any more. niles reads everything from its own
      # database and from environment variables, so the ConfigMap it used to
      # mount at /etc/niles/niles.toml is gone. Leaving the mount behind would
      # fail the pod outright rather than degrade: a configMap volume naming a
      # ConfigMap that does not exist blocks container creation.
      tmp:
        type: emptyDir
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/name: niles
        hostnames:
          - "niles.${SECRET_DOMAIN}"
        parentRefs:
          # External, now that sign-in is on and every data route answers 401
          # to an anonymous caller. Reached through the Cloudflare Tunnel,
          # which dials outbound -- no forwarded port on the UDM Pro and
          # nothing listening on the WAN.
          #
          # This line is the whole exposure. The tunnel publishes a wildcard
          # (*.mnygaard.io -> envoy-external), so there is no per-hostname
          # allowlist to add, and external-dns creates the record from this
          # route. Merging makes it public immediately; there is no staging
          # step in between.
          #
          # Only 8080 goes out. The Wyoming port stays on the LAN as its own
          # LoadBalancer at 192.168.42.19 with no HTTPRoute -- unreachable
          # from outside three times over: no port forward, the tunnel cannot
          # carry raw TCP, and the address is RFC1918. MQTT never leaves the
          # cluster at all.
          - name: envoy-external
            namespace: network
            sectionName: https
        # Required now, not optional tidying. app-template only infers the
        # backend while exactly one Service is defined; with two it cannot
        # choose, and the route would silently start pointing at the wrong
        # one -- sending the web UI at the Wyoming port. adguard-home carries
        # the same explicit block for the same reason.
        rules:
          - backendRefs:
              - identifier: app
                port: *port
