---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: niles
spec:
  chartRef:
    kind: OCIRepository
    name: niles
  interval: 1h
  values:
    controllers:
      niles:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/marknygaard/niles
              tag: sha-5ad0e43
            args:
              - serve
              - --config
              - /etc/niles/niles.toml
            env:
              TZ: Europe/Copenhagen
            envFrom:
              - secretRef:
                  name: niles-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
      # Wyoming, for the hardware voice satellite. A second Service rather
      # than another port on `app`, so the HTTP API keeps reaching the LAN
      # only through the gateway and its TLS, instead of also appearing
      # unencrypted on this address.
      #
      # LoadBalancer because the protocol is raw TCP -- line-delimited JSON
      # headers then binary audio frames -- which an HTTPRoute cannot carry.
      # That is not only a parsing objection: the gateway's Envoy runs with
      # proxy-idle-timeout-seconds 60, so a satellite holding an open
      # connection between wake words would be cut every minute. A plain L4
      # Service bypasses the proxy entirely and inherits Cilium's conntrack
      # timeout instead, which defaults to six hours for established TCP.
      #
      # The address is pinned, not allocated: the satellite is flashed with a
      # fixed host and port, so an IP that moved on redeploy would silently
      # stop working. .19 is the next free address after jitsi-meet-jvb .18.
      wyoming:
        controller: niles
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.42.19"
        ports:
          wyoming:
            port: 10300
            protocol: TCP
    persistence:
      config-file:
        type: configMap
        name: niles
        globalMounts:
          - path: /etc/niles/niles.toml
            subPath: niles.toml
            readOnly: true
      tmp:
        type: emptyDir
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/name: niles
        hostnames:
          - "niles.${SECRET_DOMAIN}"
        parentRefs:
          # External, now that sign-in is on and every data route answers 401
          # to an anonymous caller. Reached through the Cloudflare Tunnel,
          # which dials outbound -- no forwarded port on the UDM Pro and
          # nothing listening on the WAN.
          #
          # This line is the whole exposure. The tunnel publishes a wildcard
          # (*.mnygaard.io -> envoy-external), so there is no per-hostname
          # allowlist to add, and external-dns creates the record from this
          # route. Merging makes it public immediately; there is no staging
          # step in between.
          #
          # Only 8080 goes out. The Wyoming port stays on the LAN as its own
          # LoadBalancer at 192.168.42.19 with no HTTPRoute -- unreachable
          # from outside three times over: no port forward, the tunnel cannot
          # carry raw TCP, and the address is RFC1918. MQTT never leaves the
          # cluster at all.
          - name: envoy-external
            namespace: network
            sectionName: https
        # Required now, not optional tidying. app-template only infers the
        # backend while exactly one Service is defined; with two it cannot
        # choose, and the route would silently start pointing at the wrong
        # one -- sending the web UI at the Wyoming port. adguard-home carries
        # the same explicit block for the same reason.
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    configMaps:
      config:
        data:
          niles.toml: |
            # ConfigMap-managed niles.toml. Secrets are NOT here — credential
            # field values are env-var *names*, resolved at startup from the
            # niles-secret Kubernetes Secret.

            [home]
            name = "MMHome"
            latitude = 56.19427320276865
            longitude = 10.199594955503496
            timezone = "Europe/Copenhagen"
            # Explicit, because the default is imperial and nothing else in
            # this file would have revealed that. get_weather returned
            # "units":"imperial" for a home at latitude 56.19 in
            # Europe/Copenhagen, so a three-word weather question came back as
            # "59.7 °F ... 10.7 mph ... 0.09 in". The data was right; only the
            # unit system was wrong, and the LLM faithfully read back whatever
            # the tool handed it.
            #
            # `units` rather than `country = "DK"`: both are accepted here, but
            # this one says what is meant instead of leaving it to be inferred,
            # and its only two values are metric and imperial. Verified against
            # the running binary with `niles config validate` -- the parser
            # rejects unknown keys outright, so a guessed name would have
            # CrashLooped the pod rather than being quietly ignored.
            #
            # [home] is a boot-reload section, so this takes effect when
            # reloader restarts the pod, not on the next curve tick.
            units = "metric"

            [mqtt]
            host = "mosquitto.home-automation.svc.cluster.local"
            port = 1883
            username_env = "NILES_MQTT_USERNAME"
            password_env = "NILES_MQTT_PASSWORD"
            client_id = "niles"

            [database]
            # The NAME of the environment variable, never the DSN itself.
            # niles rejects a connection string in this field at startup,
            # which is the right call: a DSN here would put the password in a
            # ConfigMap, in git, and in the output of the config API. The
            # variable is delivered from niles-secret, which the helmrelease
            # pulls whole through envFrom.
            url_env = "NILES_DATABASE_URL"
            # Pinned rather than left to the default of 5, so the ceiling is
            # visible at both ends: the niles role is capped at
            # connectionLimit 10 in the database namespace, and a future
            # default above that would fail at connect time under load rather
            # than anywhere useful.
            max_connections = 5

            [api]
            bind_address = "0.0.0.0:8080"

            # Sign-in for the HTTP API and UI. Values here are environment
            # variable *names*; the values live in niles-secret and reach the
            # process through the helmrelease's envFrom.
            #
            # The key names in that Secret must be exactly these strings.
            # envFrom turns every Secret key into an env var of the same name,
            # and Kubernetes silently skips keys that are not valid identifiers
            # -- so a hyphenated key like `github-client-id` would be dropped
            # with only an InvalidVariableNames event to show for it. That
            # failure is worse than it sounds: with no credentials AND an empty
            # allowlist, sign-in reports itself off and the API is open. Check
            # `configured` in /auth/status, not just `enabled`; the two states
            # are otherwise indistinguishable.
            #
            # allowed is deliberately empty at first commit. While nobody is
            # listed the gate is off, which is how the first person gets in --
            # so this is signed in on the LAN, through envoy-internal, before
            # the route is ever pointed at envoy-external. The public DNS record
            # does not exist until that flip, and GitHub only issues a 302, so
            # the whole OAuth round trip completes internally against a real
            # Let's Encrypt certificate.
            #
            # Entries match a verified GitHub email address. Use one that will
            # not change hands -- if a listed address is ever reassigned, its
            # new owner can verify it on GitHub and sign in here.
            [auth]
            github_client_id_env = "NILES_GITHUB_CLIENT_ID"
            github_client_secret_env = "NILES_GITHUB_CLIENT_SECRET"
            session_secret_env = "NILES_SESSION_SECRET"
            api_token_env = "NILES_API_TOKEN"
            allowed = []

            [wyoming]
            # Reachable on the LAN at 192.168.42.19:10300 via the `wyoming`
            # LoadBalancer Service above. Internal only: the protocol has no
            # authentication, so this address must never be given an
            # HTTPRoute, a tunnel hostname, or any path through
            # envoy-external.
            bind_address = "0.0.0.0:10300"

            # The XVF3800 in the office, identified by source address. This is
            # what lets a room-less command ("turn off the light") resolve
            # against the room the satellite is in rather than needing the room
            # named aloud every time.
            #
            # The address must stay pinned for this to keep working: it is a
            # DHCP lease on the IoT VLAN, and a satellite that moved to a new
            # address would stop matching this entry and silently lose its room
            # rather than erroring. Worth a reservation on the UDM Pro.
            [satellites.office]
            ip = "192.168.69.188"
            room = "office"

            [stt]
            api_key_env = "GROQ_API_KEY"
            language = "en"

            [tts]
            # piper-app, not piper: the app-template Service is named after the
            # service key, and there is no bare `piper` Service to fall back
            # to, so the old name was NXDOMAIN rather than a wrong-but-routable
            # address. The LAN LoadBalancer at .17 is piper-external and is for
            # clients outside the cluster; in-cluster traffic should not leave
            # and come back.
            base_url = "http://piper-app.home-automation.svc.cluster.local:5000"
            default_voice = "jarvis-medium"

            [llm]
            api_key_env = "GROQ_API_KEY"

            [wled]
            devices = [
              { name = "living_room/ceiling", topic = "living_room/ceiling" },
              { name = "living_room/tv_light", topic = "living_room/tv_light" },
            ]

            [integrations.linear]
            # Set NILES_LINEAR_API_KEY in niles-secret if/when enabling.
            api_key_env = "NILES_LINEAR_API_KEY"
            team = "niles"

            [lighting]
            morning_start = "05:20"
            morning_end   = "06:10"
            sunset_start  = "22:30"
            sunset_end    = "23:59"
            night_floor_brightness = 15
            daytime_brightness     = 100
            # Curve pauses Fri noon → Sun noon (weekend evenings stay bright,
            # Sunday evening dims again for Monday).
            curve_pause_start = "fri 12:00"
            curve_pause_end   = "sun 12:00"
            # Morning routine intentionally omitted — niles requires
            # fire_days inside [lighting.morning_routine] when the section
            # is declared, so disabling means removing the whole section.

            [[lighting.color_temp_anchors]]
            time = "00:00"
            kelvin = 2000

            [[lighting.color_temp_anchors]]
            time = "05:45"
            kelvin = 2000

            [[lighting.color_temp_anchors]]
            time = "06:30"
            kelvin = 2700

            [[lighting.color_temp_anchors]]
            time = "12:00"
            kelvin = 4500

            [[lighting.color_temp_anchors]]
            time = "17:00"
            kelvin = 3500

            [[lighting.color_temp_anchors]]
            time = "21:30"
            kelvin = 2700

            [[lighting.color_temp_anchors]]
            time = "23:00"
            kelvin = 2000

            [[lighting.color_temp_anchors]]
            time = "23:59"
            kelvin = 2000
