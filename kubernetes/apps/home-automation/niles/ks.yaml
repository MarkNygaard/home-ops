---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: niles
spec:
  dependsOn:
    - name: mosquitto
      namespace: home-automation
  interval: 1h
  path: ./kubernetes/apps/home-automation/niles/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home-automation
  wait: false
