---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  chartRef:
    kind: OCIRepository
    name: mosquitto
  interval: 1h
  values:
    controllers:
      mosquitto:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/eclipse-mosquitto
              tag: "2.0.22"
            env:
              TZ: Europe/Copenhagen
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 1883
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: mosquitto
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.42.16"
        ports:
          mqtt:
            port: *port
            protocol: TCP
    persistence:
      data:
        existingClaim: mosquitto
        globalMounts:
          - path: /mosquitto/data
      config-file:
        type: configMap
        name: mosquitto
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
            readOnly: true
      secret:
        type: secret
        name: mosquitto-secret
        defaultMode: 0640
        globalMounts:
          - path: /mosquitto/secret
            readOnly: true
      log:
        type: emptyDir
        globalMounts:
          - path: /mosquitto/log
      tmp:
        type: emptyDir
    configMaps:
      config:
        data:
          mosquitto.conf: |
            # Mosquitto MQTT broker config
            listener 1883
            protocol mqtt

            # Auth: password file from SOPS-encrypted Secret
            allow_anonymous false
            password_file /mosquitto/secret/passwd

            # Persistence
            persistence true
            persistence_file mosquitto.db
            persistence_location /mosquitto/data/
            autosave_interval 1800

            # Logging to stdout (collected by Loki via Alloy)
            log_dest stdout
            log_type error
            log_type warning
            log_type notice
            log_type information
            connection_messages true
            log_timestamp true
