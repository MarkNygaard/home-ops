---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  chartRef:
    kind: OCIRepository
    name: zigbee2mqtt
  interval: 1h
  values:
    controllers:
      zigbee2mqtt:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 2.10.1
            envFrom:
              - secretRef:
                  name: zigbee2mqtt-secret
            env:
              TZ: Europe/Copenhagen
              # MQTT broker
              ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://192.168.42.16:1883
              ZIGBEE2MQTT_CONFIG_MQTT_USER: zigbee2mqtt
              ZIGBEE2MQTT_CONFIG_MQTT_BASE_TOPIC: zigbee2mqtt
              # Adapter (SLZB-06MU runs EmberZNet by default)
              ZIGBEE2MQTT_CONFIG_SERIAL_PORT: tcp://192.168.69.20:6638
              ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: ember
              # Frontend (web UI)
              ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "true"
              ZIGBEE2MQTT_CONFIG_FRONTEND_HOST: 0.0.0.0
              ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: &port 8080
              # First-run safety: don't allow joins until you explicitly enable in UI
              ZIGBEE2MQTT_CONFIG_PERMIT_JOIN: "false"
              # Generate a fresh ZigBee network key on first run. Cross-stack
              # migration from the previous Z-Stack USB dongle to this
              # EmberZNet SLZB-06MU couldn't preserve device pairings (see
              # 21:15 logs — RESET_ASSERT / ROUTE_ERROR_ADDRESS_CONFLICT).
              # Clean slate; re-pair devices via the z2m UI.
              ZIGBEE2MQTT_CONFIG_ADVANCED_NETWORK_KEY: GENERATE
              # HA integration on during transition (publishes discovery topics
              # so HA auto-imports devices). The new Rust app subscribes to the
              # raw zigbee2mqtt/* topics independently — discovery topics are
              # additive, no conflict.
              ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED: "true"
              # Availability tracking (lets z2m mark devices online/offline)
              ZIGBEE2MQTT_CONFIG_AVAILABILITY_ENABLED: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: zigbee2mqtt
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: zigbee2mqtt
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
    route:
      app:
        hostnames:
          - "z2m.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
