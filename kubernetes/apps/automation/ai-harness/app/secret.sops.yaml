# Infra secrets only. Provider tokens (Claude / Codex / Kimi) are entered in the
# harness UI's Credentials page and stored encrypted in Postgres under
# HARNESS_SECRET_KEY — NOT put here.
#
# HARNESS_SECRET_KEY must stay stable; rotating it makes previously stored
# provider credentials undecryptable (you'd just re-enter them in the UI).
#
# HARNESS_API_TOKEN intentionally NOT set: when configured, harness-server's
# ws_handler does an internal bearer check on the WebSocket upgrade, and
# browser WebSocket clients can't natively send Authorization: Bearer. Result
# would be a UI that loads but never receives live updates. envoy-internal +
# the LAN are the security boundary here. Add API token gating later only
# if you've worked out how to feed the bearer to the UI.
