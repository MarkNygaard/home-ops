---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-harness
spec:
  chartRef:
    kind: OCIRepository
    name: ai-harness
  interval: 1h
  values:
    controllers:
      ai-harness:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # harness-server validates that HARNESS_PROJECT_ROOT exists as a
          # directory at startup and exits otherwise. Make sure it's there
          # before the main container runs.
          ensure-project-root:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command: ["sh", "-c"]
            args: ["mkdir -p /home/harness/project"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: ghcr.io/marknygaard/ai-harness
              tag: main-34c0c1b
            env:
              TZ: Europe/Copenhagen
              HARNESS_HTTP_ADDR: 0.0.0.0:8080
              HARNESS_PROJECT_ROOT: /home/harness/project
            envFrom:
              - secretRef:
                  name: ai-harness-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 8
                memory: 8Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      home:
        existingClaim: ai-harness
        globalMounts:
          - path: /home/harness
      tmp:
        type: emptyDir
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/name: ai-harness
        hostnames:
          - "harness.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
