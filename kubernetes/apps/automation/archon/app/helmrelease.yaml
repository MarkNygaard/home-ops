---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: archon
spec:
  chartRef:
    kind: OCIRepository
    name: archon
  interval: 1h
  values:
    controllers:
      archon:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # Custom image = upstream coleam00/archon + build-essential
              # so cargo can link C deps without the Zig cc wrapper hack.
              # See kubernetes/apps/automation/archon/image/Containerfile
              # and .github/workflows/archon-image.yaml.
              repository: ghcr.io/marknygaard/archon
              tag: latest
            envFrom:
              - secretRef:
                  name: archon-secret
            env:
              TZ: Europe/Copenhagen
              DOMAIN: "archon.${SECRET_DOMAIN}"
              PORT: &port 3000
              CLAUDE_BIN_PATH: /app/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude
              # PVC-resident pnpm/node/npm/npx/cargo live in /home/appuser/.pi/agent/bin
              # (see project_archon_pi.md memory). Prepend so Archon's native `type: bash`
              # workflow nodes resolve them — LLM-spawned bash tools inject this dir
              # themselves, but @archon/server's own PATH does not.
              PATH: "/home/appuser/.pi/agent/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/bun-node-fallback-bin"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 6Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: archon
        globalMounts:
          - path: /.archon
            subPath: data
          - path: /home/appuser
            subPath: home
      tmp:
        type: emptyDir
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/name: archon
        hostnames:
          - "archon.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
