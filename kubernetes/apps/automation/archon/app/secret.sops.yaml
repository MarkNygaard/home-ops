# Fill in placeholders, then encrypt: sops -e -i secret.sops.yaml
# DATABASE_URL format: postgresql://archon:<password>@postgres-rw.database.svc.cluster.local:5432/archon
# CLAUDE_CODE_OAUTH_TOKEN: get from `~/.claude/credentials.json` (or macOS Keychain) after `claude login`
# CODEX_*: get from `~/.codex/auth.json` after `codex login`
apiVersion: v1
kind: Secret
metadata:
  name: archon-secret
stringData:
  DATABASE_URL: "REPLACE_ME"
  CLAUDE_CODE_OAUTH_TOKEN: "REPLACE_ME"
  CODEX_ID_TOKEN: "REPLACE_ME"
  CODEX_ACCESS_TOKEN: "REPLACE_ME"
  CODEX_REFRESH_TOKEN: "REPLACE_ME"
  CODEX_ACCOUNT_ID: "REPLACE_ME"
