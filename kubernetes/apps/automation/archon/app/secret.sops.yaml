# Fill in placeholders, then encrypt: sops -e -i secret.sops.yaml
#
# DATABASE_URL format:
#   postgresql://archon:<password>@postgres-rw.database.svc.cluster.local:5432/archon
#
# CODEX_*: extract from ~/.codex/auth.json after running `codex login` locally.
#   These are written to ~/.codex/auth.json in the container by Archon's
#   setup-auth on every boot; setup-auth also writes ~/.codex/config.toml
#   with YOLO mode (approval_policy=never) so Codex runs headless.
#
# Claude Code is NOT seeded via env. After first deploy, bootstrap once:
#   kubectl exec -it -n automation deploy/archon -c app -- claude login
#   The credentials persist on the PVC at /home/appuser/.claude/credentials.json
#   and Claude Code refreshes them in place.
