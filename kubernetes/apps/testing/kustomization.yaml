---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: testing

components:
  - ../../components/sops

resources:
  - ./namespace.yaml
  - ./k6-operator/ks.yaml
  # Only the operator is Flux-managed. Individual load tests are applied
  # manually with kubectl from a workstation that has kubeconfig + age.key:
  #
  #   # one-time per machine (or after credential rotation): apply the
  #   # k6 remote-write Secret without writing plaintext to disk
  #   sops -d kubernetes/apps/testing/k6-operator/<test>/secret.sops.yaml \
  #     | kubectl apply -f -
  #
  #   # run a test (TestRun + ConfigMap)
  #   kubectl apply  -k kubernetes/apps/testing/k6-operator/testrun
  #   kubectl apply  -k kubernetes/apps/testing/k6-operator/campaign
  #
  #   # stop / clean up
  #   kubectl delete -k kubernetes/apps/testing/k6-operator/testrun
  #   kubectl delete -k kubernetes/apps/testing/k6-operator/campaign
