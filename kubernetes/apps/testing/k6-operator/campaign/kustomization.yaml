---
# Applied via Flux when ./ks.yaml is referenced from the testing kustomization.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: testing

# Script is self-contained (SKUs + product URLs inline), so no data file.
configMapGenerator:
  - name: k6-campaign-simulation
    files:
      - campaign-simulation-v2.js

generatorOptions:
  disableNameSuffixHash: true

resources:
  - testrun.yaml
  - secret.sops.yaml
