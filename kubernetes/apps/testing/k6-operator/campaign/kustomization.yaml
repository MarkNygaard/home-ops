---
# Applied MANUALLY from a workstation with kubectl + age.key:
#   sops -d secret.sops.yaml | kubectl apply -f -      # one-time / on rotation
#   kubectl apply -k kubernetes/apps/testing/k6-operator/campaign
#   kubectl delete -k kubernetes/apps/testing/k6-operator/campaign   # stop
#
# secret.sops.yaml is intentionally NOT in resources — plain kustomize can't
# decrypt SOPS. Apply it via the `sops -d | kubectl apply -f -` pipe so the
# plaintext never touches disk.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: testing

# Script is self-contained (SKUs + product URLs inline), so no data file.
configMapGenerator:
  - name: k6-campaign-simulation
    files:
      - campaign-simulation-v2.js

generatorOptions:
  disableNameSuffixHash: true

resources:
  - testrun.yaml
