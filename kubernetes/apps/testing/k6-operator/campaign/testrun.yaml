---
# Campaign simulation — modeA (capacity): 15 min, ramps 1000→3000 req/s across
# 5 stages, mixed cart(50%)/inventory(30%)/product(15%)/purchase(5%) workload
# mirroring prod Sentry traffic.
#
# All dilling-specific values (endpoint, store key, Grafana remote-write target
# + creds) come from the SOPS secret k6-secrets — nothing usable to run this
# against dilling lives in this public repo; a fork can't decrypt it.
#
# setup() creates a cart pool PER RUNNER, so parallelism 4 ≈ 4000 carts warmed
# before load starts (setupTimeout 10m is set in the script options).
#
# RUN/STOP: activate/deactivate ./ks.yaml from the testing kustomization.
# Logs:     kubectl logs -n testing -l k6_cr=campaign-simulation-v2 -f --prefix
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: campaign-simulation-v2
  namespace: testing
spec:
  parallelism: 4
  cleanup: post
  # MODE via --env so the initializer and every runner compute the same plan.
  arguments: --env MODE=modeA
  script:
    configMap:
      name: k6-campaign-simulation
      file: campaign-simulation-v2.js
  runner:
    # Pinned so the experimental-prometheus-rw output name is deterministic.
    image: grafana/k6:2.2.0
    env:
      - name: K6_OUT
        value: experimental-prometheus-rw
      - name: K6_PROMETHEUS_RW_TREND_STATS
        value: p(90),p(95),p(99),min,max,avg,med
      - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
        value: 5s
      - name: K6_RUNNER_ID
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      # Endpoint, store key, remote-write target + creds — all from the SOPS
      # secret so none of it is published in this public repo.
      - name: K6_BASE_URL
        valueFrom:
          secretKeyRef:
            name: k6-secrets
            key: K6_BASE_URL
      - name: K6_STORE_KEY
        valueFrom:
          secretKeyRef:
            name: k6-secrets
            key: K6_STORE_KEY
      - name: K6_PROMETHEUS_RW_SERVER_URL
        valueFrom:
          secretKeyRef:
            name: k6-secrets
            key: K6_PROMETHEUS_RW_SERVER_URL
      - name: K6_PROMETHEUS_RW_USERNAME
        valueFrom:
          secretKeyRef:
            name: k6-secrets
            key: K6_PROMETHEUS_RW_USERNAME
      - name: K6_PROMETHEUS_RW_PASSWORD
        valueFrom:
          secretKeyRef:
            name: k6-secrets
            key: K6_PROMETHEUS_RW_PASSWORD
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "3"
        memory: 4Gi
