---
# Git-driven trigger for the campaign-simulation-v2 load test.
# Intentionally NOT referenced by kubernetes/apps/testing/kustomization.yaml by
# default, so it fires nothing on a normal push.
#
# RUN:  add `- ./k6-operator/campaign/ks.yaml` to apps/testing/kustomization.yaml,
#       commit & push.
# STOP: remove that line, push (prune deletes the TestRun, ConfigMap and Secret).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k6-campaign-simulation
spec:
  dependsOn:
    - name: k6-operator
  interval: 1h
  path: ./kubernetes/apps/testing/k6-operator/campaign
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: testing
  wait: false
