---
# Installs the k6-operator (controller + TestRun/PrivateLoadZone CRDs).
# Actual load tests live in ./testrun and ./campaign and are applied MANUALLY
# (kubectl apply -k), so a git push never accidentally fires a 2000 req/s run.
# See kubernetes/apps/testing/kustomization.yaml for the apply commands.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k6-operator
spec:
  interval: 1h
  path: ./kubernetes/apps/testing/k6-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: testing
  wait: true
