---
# Distributed load test against the dev2 inventory API.
#
# All dilling-specific values (endpoint, store key, Grafana remote-write target
# + creds) come from the SOPS secret k6-secrets — nothing usable to run this
# against dilling lives in this public repo; a fork can't decrypt it.
#
# Fire it:    activate ./ks.yaml from the testing kustomization (commit & push).
# Watch it:   kubectl get testrun,pods -n testing -w
# Logs:       kubectl logs -n testing -l k6_cr=inventory-stress-v2 -f --prefix
#
# `cleanup: post` removes runner pods after the test finishes.
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: inventory-stress-v2
  namespace: testing
spec:
  # Arrival rate (PEAK req/s) is split across this many runner pods via
  # execution segments — 4 runners ≈ 750 req/s each at PEAK=3000.
  parallelism: 4
  cleanup: post
  # PEAK/DURATION via --env so the initializer and every runner compute the
  # same execution plan before k6-operator segments the arrival rate.
  arguments: --env PEAK=3000 --env DURATION=5m
  script:
    configMap:
      name: k6-inventory-stress
      file: inventory-stress-v2.js
  runner:
    # Pinned so the experimental-prometheus-rw output name is deterministic.
    image: grafana/k6:2.1.0
    env:
      - name: K6_OUT
        value: experimental-prometheus-rw
      - name: K6_PROMETHEUS_RW_TREND_STATS
        value: p(90),p(95),p(99),min,max,avg,med
      - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
        value: 5s
      # Distinct per-runner label (see script tags note).
      - name: K6_RUNNER_ID
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      # Endpoint, store key, remote-write target + creds — all from the SOPS
      # secret so none of it is published in this public repo.
      - name: K6_BASE_URL
        valueFrom:
          secretKeyRef:
            name: k6-secrets
            key: K6_BASE_URL
      - name: K6_STORE_KEY
        valueFrom:
          secretKeyRef:
            name: k6-secrets
            key: K6_STORE_KEY
      - name: K6_PROMETHEUS_RW_SERVER_URL
        valueFrom:
          secretKeyRef:
            name: k6-secrets
            key: K6_PROMETHEUS_RW_SERVER_URL
      - name: K6_PROMETHEUS_RW_USERNAME
        valueFrom:
          secretKeyRef:
            name: k6-secrets
            key: K6_PROMETHEUS_RW_USERNAME
      - name: K6_PROMETHEUS_RW_PASSWORD
        valueFrom:
          secretKeyRef:
            name: k6-secrets
            key: K6_PROMETHEUS_RW_PASSWORD
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
