---
# Distributed load test against the dev2 inventory API.
#
# Fire it:    kubectl apply -k kubernetes/apps/testing/k6-operator/testrun
# Watch it:   kubectl get testrun,pods -n testing -w
# Logs:       kubectl logs -n testing -l k6_cr=inventory-stress-v2 -f --prefix
# Stop / reset (also required before re-running with the same name):
#             kubectl delete -k kubernetes/apps/testing/k6-operator/testrun
#
# `cleanup: post` removes runner pods after the test finishes. To tweak load,
# edit PEAK / DURATION below (or spec.parallelism) and re-apply.
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: inventory-stress-v2
  namespace: testing
spec:
  # Arrival rate (PEAK req/s) is split across this many runner pods via
  # execution segments — 4 runners ≈ 750 req/s each at PEAK=3000.
  parallelism: 4
  cleanup: post
  # PEAK/DURATION go through --env (not runner.env) so the initializer pod and
  # every runner compute the SAME execution plan — k6-operator segments the
  # arrival rate from what the initializer reports, so they must match.
  arguments: --env PEAK=3000 --env DURATION=5m
  script:
    configMap:
      name: k6-inventory-stress
      file: inventory-stress-v2.js
  runner:
    # Pinned so the experimental-prometheus-rw output name is deterministic.
    image: grafana/k6:0.55.0
    env:
      # Only runners emit metrics (K6_OUT here, not in arguments, keeps the
      # initializer's k6 inspect/archive step clean). Results stream to the
      # dilling Grafana via Prometheus remote write.
      - name: K6_OUT
        value: experimental-prometheus-rw
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: https://prometheus.dilling.io/api/v1/write
      - name: K6_PROMETHEUS_RW_TREND_STATS
        value: p(90),p(95),p(99),min,max,avg,med
      - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
        value: 5s
      # Distinct per-runner label (see script tags note).
      - name: K6_RUNNER_ID
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      # Basic-auth creds for the remote-write endpoint — from the SOPS secret.
      - name: K6_PROMETHEUS_RW_USERNAME
        valueFrom:
          secretKeyRef:
            name: k6-prometheus-rw
            key: K6_PROMETHEUS_RW_USERNAME
      - name: K6_PROMETHEUS_RW_PASSWORD
        valueFrom:
          secretKeyRef:
            name: k6-prometheus-rw
            key: K6_PROMETHEUS_RW_PASSWORD
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
