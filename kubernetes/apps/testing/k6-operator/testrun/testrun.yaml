---
# Distributed load test against the dev2 inventory API.
#
# Fire it:    kubectl apply -k kubernetes/apps/testing/k6-operator/testrun
# Watch it:   kubectl get testrun,pods -n testing -w
# Logs:       kubectl logs -n testing -l k6_cr=inventory-stress-v2 -f --prefix
# Stop / reset (also required before re-running with the same name):
#             kubectl delete -k kubernetes/apps/testing/k6-operator/testrun
#
# `cleanup: post` removes runner pods after the test finishes. To tweak load,
# edit PEAK / DURATION below (or spec.parallelism) and re-apply.
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: inventory-stress-v2
  namespace: testing
spec:
  # Arrival rate (PEAK req/s) is split across this many runner pods via
  # execution segments — 4 runners ≈ 750 req/s each at PEAK=3000.
  parallelism: 4
  cleanup: post
  script:
    configMap:
      name: k6-inventory-stress
      file: inventory-stress-v2.js
  runner:
    env:
      - name: PEAK
        value: "3000"
      - name: DURATION
        value: "5m"
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
