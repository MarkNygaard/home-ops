# All dilling-specific values needed to run the test: the store key and the
# Grafana remote-write target + basic-auth creds. Kept in SOPS so none of it is
# published in this public repo and a fork (without the age key) can't decrypt
# it to run the test against our environment.
#
# K6_BASE_URL is deliberately BLANK. No environment is targeted by default, so
# an accidental apply cannot reach dev2 or prod — setup() throws "No base URL".
# Choose the target explicitly at run time via the TestRun's arguments field:
#
#   arguments: --env K6_BASE_URL=https://<front-door-host>
#
# (an explicit --env overrides the blank pod env var). Every k6 test folder
# writes this SAME Secret (k6-secrets in namespace testing), so the blank also
# stops them silently inheriting whichever target was applied last.
