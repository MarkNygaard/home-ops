---
# Applied MANUALLY from a workstation with kubectl + age.key:
#   sops -d secret.sops.yaml | kubectl apply -f -      # one-time / on rotation
#   kubectl apply -k kubernetes/apps/testing/k6-operator/testrun
#   kubectl delete -k kubernetes/apps/testing/k6-operator/testrun   # stop
#
# secret.sops.yaml is intentionally NOT in resources — plain kustomize can't
# decrypt SOPS. Apply it via the `sops -d | kubectl apply -f -` pipe so the
# plaintext never touches disk.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: testing

# Bundle the script and the SKU pool into one ConfigMap. k6-operator mounts the
# whole ConfigMap into /test/, so the script's open('./inventory-skus.json')
# resolves. disableNameSuffixHash keeps the name stable for the TestRun ref.
configMapGenerator:
  - name: k6-inventory-stress
    files:
      - inventory-stress-v2.js
      - inventory-skus.json

generatorOptions:
  disableNameSuffixHash: true

resources:
  - testrun.yaml
