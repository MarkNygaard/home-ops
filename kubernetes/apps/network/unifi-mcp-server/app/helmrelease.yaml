---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-mcp-server
spec:
  chartRef:
    kind: OCIRepository
    name: unifi-mcp-server
  interval: 1h
  values:
    controllers:
      unifi-mcp-server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/enuno/unifi-mcp-server
              tag: 0.2.6
            env:
              TZ: Europe/Copenhagen
              UNIFI_API_TYPE: local
              UNIFI_LOCAL_HOST: 192.168.1.1
              # Self-signed cert on the UDM Pro — verification would need
              # a CA we don't have.
              UNIFI_LOCAL_VERIFY_SSL: "false"
              # The README suggests `streamable_http`, but that value passes
              # the app's own enum validator only to be rejected by the
              # bundled FastMCP one layer down (which wants `streamable-http`).
              # Setting `http` here skips that dispatch mismatch — the app
              # still serves Streamable HTTP on /mcp, just under a different
              # internal transport name.
              MCP_SERVER_TRANSPORT: http
              MCP_SERVER_PORT: &port 3000
            envFrom:
              - secretRef:
                  name: unifi-mcp-server-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      tmp:
        type: emptyDir
    route:
      app:
        annotations:
          # Checks `/`, expecting the 404 the app's router returns. Not `/mcp`,
          # which is where this check used to point and what made the pod sick.
          #
          # Every sessionless request to /mcp leaks ~38 KiB, permanently, in
          # 0.2.6 — measured: 500 requests moved RSS +18.6 MiB and it stayed
          # there, while 500 requests to `/` moved it +0.33 MiB, which is the
          # baseline. At one probe a minute that is 54 MiB/day, a dead-straight
          # line from 117 to 507 MiB over seven days, and at 511/512 MiB the
          # container did not OOM-kill: it sat thrashing ~1,178 major page
          # faults/sec, still Ready, still answering, just slowly. Reported as
          # enuno/unifi-mcp-server#173.
          #
          # What this costs: a 404 proves the app is answering — Envoy returns
          # 503 if the pod is gone and 404 comes from the app itself — but it no
          # longer proves the MCP handler specifically works, which is what the
          # 406 on /mcp used to demonstrate. That was the better check, and it
          # was not worth 54 MiB a day to keep. Revisit when #173 is fixed.
          gatus.home-operations.com/endpoint: |-
            url: https://unifi-mcp.${SECRET_DOMAIN}/
            conditions: ["[STATUS] == 404"]
        hostnames:
          - "unifi-mcp.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: unifi-mcp-server
                port: *port
