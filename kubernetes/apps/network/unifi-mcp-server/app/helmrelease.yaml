---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-mcp-server
spec:
  chartRef:
    kind: OCIRepository
    name: unifi-mcp-server
  interval: 1h
  values:
    controllers:
      unifi-mcp-server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/enuno/unifi-mcp-server
              tag: 0.2.5
            env:
              TZ: Europe/Copenhagen
              UNIFI_API_TYPE: local
              UNIFI_LOCAL_HOST: 192.168.1.1
              # Self-signed cert on the UDM Pro — verification would need
              # a CA we don't have.
              UNIFI_LOCAL_VERIFY_SSL: "false"
              # The README suggests `streamable_http`, but that value passes
              # the app's own enum validator only to be rejected by the
              # bundled FastMCP one layer down (which wants `streamable-http`).
              # Setting `http` here skips that dispatch mismatch — the app
              # still serves Streamable HTTP on /mcp, just under a different
              # internal transport name.
              MCP_SERVER_TRANSPORT: http
              MCP_SERVER_PORT: &port 3000
            envFrom:
              - secretRef:
                  name: unifi-mcp-server-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      tmp:
        type: emptyDir
    route:
      app:
        hostnames:
          - "unifi-mcp.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: unifi-mcp-server
                port: *port
