---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-mcp-server
spec:
  chartRef:
    kind: OCIRepository
    name: unifi-mcp-server
  interval: 1h
  values:
    controllers:
      unifi-mcp-server:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/enuno/unifi-mcp-server
              tag: 0.2.6
            env:
              TZ: Europe/Copenhagen
              UNIFI_API_TYPE: local
              UNIFI_LOCAL_HOST: 192.168.1.1
              # Self-signed cert on the UDM Pro — verification would need
              # a CA we don't have.
              UNIFI_LOCAL_VERIFY_SSL: "false"
              # The README suggests `streamable_http`, but that value passes
              # the app's own enum validator only to be rejected by the
              # bundled FastMCP one layer down (which wants `streamable-http`).
              # Setting `http` here skips that dispatch mismatch — the app
              # still serves Streamable HTTP on /mcp, just under a different
              # internal transport name.
              MCP_SERVER_TRANSPORT: http
              MCP_SERVER_PORT: &port 3000
            envFrom:
              - secretRef:
                  name: unifi-mcp-server-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      tmp:
        type: emptyDir
    route:
      app:
        annotations:
          # The default generated check hits / and expects 200, which this app
          # has never served -- it answers 404 on /, /health, /healthz and
          # /sse, because it is an MCP server rather than a web app. The check
          # has been red since deployment while the pod sat Running with zero
          # restarts for seven days. Nothing was broken; the check was asking
          # the wrong question.
          #
          # Pointed at /mcp, the only path the app actually serves. A bare GET
          # there is rejected with 406, because MCP streamable HTTP requires an
          # Accept of application/json plus text/event-stream -- and that 406
          # is the useful signal: it comes from the MCP handler itself, so it
          # proves the protocol endpoint is answering rather than merely that
          # something is listening. If the pod dies Envoy returns 503, and if
          # the route breaks it returns 404; both fail this condition.
          #
          # Asserting 406 rather than driving a real handshake, on purpose. A
          # POST of initialize would prove more, but it mints an MCP session on
          # every probe -- 1440 a day at this interval -- and pins the check to
          # a protocol version that will age out. flux-webhook in the reference
          # cluster asserts 404 for the same class of reason.
          gatus.home-operations.com/endpoint: |-
            url: https://unifi-mcp.${SECRET_DOMAIN}/mcp
            conditions: ["[STATUS] == 406"]
        hostnames:
          - "unifi-mcp.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: unifi-mcp-server
                port: *port
