---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
spec:
  chartRef:
    kind: OCIRepository
    name: cloudflare-tunnel
  interval: 1h
  values:
    controllers:
      cloudflare-tunnel:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/cloudflare/cloudflared
              tag: 2026.10.7
            env:
              NO_AUTOUPDATE: true
              TUNNEL_METRICS: 0.0.0.0:8080
              TUNNEL_POST_QUANTUM: true # disable when using http2
              TUNNEL_TRANSPORT_PROTOCOL: quic # or http2
            # No envFrom. TUNNEL_TOKEN is deliberately NOT injected: when it
            # is present, `tunnel run` fetches its ingress rules from the
            # Cloudflare dashboard and ignores this repo entirely. That was
            # the state until now -- the config below was mounted and
            # decorative, which is exactly how a wrong routing change can look
            # applied while doing nothing.
            #
            # The token is kept in the Secret unused, as the rollback: putting
            # envFrom back and dropping --config restores dashboard control
            # without needing to reissue anything.
            args: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "run"]
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
    configMaps:
      config:
        data:
          config.yaml: |-
            # Authoritative -- for real this time, and worth saying why the
            # two previous attempts were not.
            #
            # First the tunnel ran token-based: TUNNEL_TOKEN's presence makes
            # `tunnel run` fetch rules from the dashboard and never read this
            # file. Then it ran with --config and a credentials file, which
            # cloudflared did read -- but the tunnel was still registered
            # config_src=cloudflare, and remote configuration takes
            # precedence, so the dashboard ruleset kept serving. Both times
            # the config looked applied and did nothing, which is exactly what
            # made it hard to catch.
            #
            # config_src cannot be changed after creation (PATCH accepts only
            # name and tunnel_secret), so the fix was a new tunnel created
            # with config_src=local -- it has no remote configuration to be
            # overridden by. Confirm with:
            #
            #   GET /accounts/{acct}/cfd_tunnel/{id}/configurations
            #     source: local
            #
            # Editing this file now changes routing for every public service.
            tunnel: ${TUNNEL_ID}
            credentials-file: /etc/cloudflared/creds.json
            ingress:
              # originServerName rather than noTLSVerify. It is the SNI
              # cloudflared presents to envoy, not the public hostname, so
              # envoy serves its real *.${SECRET_DOMAIN} certificate and the
              # hop stays verified. The dashboard config this replaces used
              # noTLSVerify: true for the first rule, which skipped the check
              # instead of fixing the name mismatch behind it.
              - hostname: "*.${SECRET_DOMAIN}"
                originRequest:
                  originServerName: external.${SECRET_DOMAIN}
                service: https://envoy-external.{{ .Release.Namespace }}.svc.cluster.local:443
              # Second zone, same backend and same SNI. Browser TLS terminates
              # at Cloudflare's edge, which issues for this zone automatically
              # on a proxied record, so no certificate is needed here.
              - hostname: "*.${STEPLANE_DOMAIN}"
                originRequest:
                  originServerName: external.${SECRET_DOMAIN}
                service: https://envoy-external.{{ .Release.Namespace }}.svc.cluster.local:443
              - service: http_status:404
            #
            # http2Origin is deliberately absent, though the previous version
            # of this file set it. The working dashboard config never used it,
            # and zero-cache serves WebSockets, whose upgrade HTTP/2 to origin
            # complicates. Porting it over would have been a regression
            # disguised as a faithful translation.
    persistence:
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/cloudflared/config.yaml
            subPath: config.yaml
      # Derived from the existing TUNNEL_TOKEN, not newly issued: the token is
      # base64 JSON holding the same account, tunnel and secret values this
      # file needs under different names. The tunnel identity is unchanged, so
      # no DNS record and nothing in Cloudflare has to be touched.
      credentials:
        type: secret
        name: cloudflare-tunnel-secret
        globalMounts:
          - path: /etc/cloudflared/creds.json
            subPath: TUNNEL_CREDENTIALS
